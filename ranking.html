<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Días Felices - Ranking MySpace</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050505;
            --text-main: #ffffff;
            --text-muted: #777777;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        .interactive-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            transition: transform 0.2s ease-out;
        }
        .orb-1 { width: 40vw; height: 40vw; background: rgba(255, 255, 255, 0.15); top: -5%; left: -5%; animation: float 20s infinite alternate ease-in-out; }
        .orb-2 { width: 35vw; height: 35vw; background: rgba(60, 130, 200, 0.2); bottom: -5%; right: -5%; animation: float 25s infinite alternate-reverse ease-in-out; }
        @keyframes float { 0% { margin-top: 0; margin-left: 0; } 100% { margin-top: 50px; margin-left: 80px; } }

        .main-content { padding: 40px 20px; max-width: 800px; margin: 0 auto; width: 100%; flex: 1; }
        .ranking-box {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 8px;
        }
        .ranking-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.2);
            margin-bottom: 10px;
            border-radius: 6px;
        }
        .ranking-item:first-child { border-left: 4px solid #3c82c8; }
        .user-info { display: flex; align-items: center; gap: 20px; }
        .user-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); }
        .user-name { font-family: 'Oswald', sans-serif; font-size: 1.2rem; margin: 0; letter-spacing: 1px; }
        .user-apodo { font-size: 0.8rem; color: #8ebdf0; margin: 0; }
        .user-points { font-family: 'Oswald', sans-serif; font-size: 1.4rem; color: #fff; }
    </style>
</head>
<body>
    <div class="interactive-bg">
        <div class="orb orb-1" id="orb1"></div>
        <div class="orb orb-2" id="orb2"></div>
    </div>

    <div id="menu-container"></div>

    <div class="main-content">
        <h2 class="mb-4 text-center" style="font-family: 'Oswald', sans-serif; letter-spacing: 2px;">TOP AMIGOS MYSPACE</h2>
        <div class="ranking-box" id="rankingList">
            <p class="text-center text-muted">Cargando ranking...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script>
        fetch('menu.html').then(r => r.text()).then(d => {
            document.getElementById('menu-container').innerHTML = d;
            const linkRanking = document.getElementById('link-ranking');
            if(linkRanking) linkRanking.classList.add('active');
        });

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            document.getElementById('orb1').style.transform = `translate(${x * 80}px, ${y * 80}px)`;
            document.getElementById('orb2').style.transform = `translate(${x * -60}px, ${y * -60}px)`;
        });

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(async () => {
                const { data: amigos, error } = await supabaseClient
                    .from('amigos')
                    .select('*')
                    .order('puntos_myspace', { ascending: false });

                const container = document.getElementById('rankingList');
                if (error) return container.innerHTML = `<p class="text-danger">Error: ${error.message}</p>`;
                if (!amigos.length) return container.innerHTML = `<p class="text-muted text-center">No hay amigos registrados todavía.</p>`;

                container.innerHTML = amigos.map((user, index) => {
                    const foto = user.foto_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.nombre_real)}&background=111111&color=ffffff`;
                    return `
                        <div class="ranking-item">
                            <div class="user-info">
                                <span style="font-family: 'Oswald', sans-serif; font-size: 1.2rem; width: 25px; color: #777;">#${index + 1}</span>
                                <img src="${foto}" class="user-avatar">
                                <div>
                                    <h4 class="user-name">${user.nombre_real || 'Anónimo'}</h4>
                                    <p class="user-apodo">${user.apodo_denigrante ? '@' + user.apodo_denigrante : 'Sin apodo asignado'}</p>
                                </div>
                            </div>
                            <div class="user-points">
                                ${user.puntos_myspace || 0} pts
                            </div>
                        </div>
                    `;
                }).join('');
            }, 500);
        });
    </script>
</body>
</html>
