<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Días Felices - Mi Perfil</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050505;
            --text-main: #ffffff;
            --text-muted: #777777;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- FONDO ANIMADO --- */
        .interactive-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            transition: transform 0.2s ease-out;
        }
        .orb-1 {
            width: 40vw; height: 40vw;
            background: rgba(255, 255, 255, 0.15);
            top: -5%; left: -5%;
            animation: float 20s infinite alternate ease-in-out;
        }
        .orb-2 {
            width: 35vw; height: 35vw;
            background: rgba(60, 130, 200, 0.2);
            bottom: -5%; right: -5%;
            animation: float 25s infinite alternate-reverse ease-in-out;
        }
        @keyframes float {
            0% { margin-top: 0; margin-left: 0; }
            100% { margin-top: 50px; margin-left: 80px; }
        }

        /* --- MENÚ --- */
        .navbar-custom {
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .navbar-brand-txt {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .nav-links { display: flex; gap: 40px; }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--text-main); }

        /* --- TARJETA DE PERFIL --- */
        .main-content {
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 40px 20px;
        }
        .profile-box {
            width: 100%; 
            max-width: 600px; 
            padding: 40px;
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .profile-img-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--border-color);
            background: #111;
        }
        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-name {
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .profile-role {
            font-size: 0.8rem;
            color: #8ebdf0;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .stats-container {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 30px;
        }
        .stat-item h4 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            margin: 0;
        }
        .stat-item p {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- FORMULARIO EDICIÓN --- */
        .form-control-custom {
            width: 100%; 
            background: transparent; 
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; 
            padding: 12px 0; 
            margin-bottom: 25px;
            font-size: 0.9rem;
        }
        .form-control-custom:focus {
            outline: none;
            border-bottom-color: #fff;
        }
        .btn-auth {
            background: #fff; 
            color: #050505; 
            border: none; 
            padding: 16px; 
            width: 100%;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.8rem;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn-auth:hover { opacity: 0.8; }

        @media (max-width: 768px) {
            .navbar-custom { flex-direction: column; padding: 20px 5%; gap: 15px; }
            .nav-links { gap: 20px; width: 100%; justify-content: center; flex-wrap: wrap; }
            .stats-container { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <div class="interactive-bg">
        <div class="orb orb-1" id="orb1"></div>
        <div class="orb orb-2" id="orb2"></div>
    </div>

    <div id="menu-container"></div>

    <div class="main-content">
        <div class="profile-box">
            
            <div class="profile-img-container">
                <img id="displayFoto" src="https://via.placeholder.com/150/111111/FFFFFF?text=?" alt="Foto de perfil">
            </div>
            
            <h2 class="profile-name" id="displayNombre">Cargando...</h2>
            <div class="profile-role" id="displayRol">---</div>

            <div class="stats-container">
                <div class="stat-item">
                    <h4 id="displayApodo">---</h4>
                    <p>Apodo</p>
                </div>
                <div class="stat-item">
                    <h4 id="displayPuntos">0</h4>
                    <p>Puntos MySpace</p>
                </div>
            </div>

            <form id="perfilForm" style="text-align: left; display: none;">
                <h5 style="font-family: 'Oswald', sans-serif; letter-spacing: 1px; margin-bottom: 20px;">EDITAR PERFIL</h5>
                
                <input type="text" id="inputFoto" class="form-control-custom" placeholder="URL de tu foto de perfil (Ej: https://imgur.com/...)">
                
                <textarea id="inputBio" class="form-control-custom" rows="2" placeholder="Escribe tu biografía troll aquí..."></textarea>
                
                <button type="submit" class="btn-auth">GUARDAR CAMBIOS</button>
            </form>

        </div>
    </div>

    <!-- Scripts de Interfaz -->
    <script>
        fetch('menu.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('menu-container').innerHTML = data;
                const linkPerfil = document.getElementById('link-perfil');
                if (linkPerfil) linkPerfil.classList.add('active');
            });

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            document.getElementById('orb1').style.transform = `translate(${x * 80}px, ${y * 80}px)`;
            document.getElementById('orb2').style.transform = `translate(${x * -60}px, ${y * -60}px)`;
        });
    </script>
    
    <!-- Scripts de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>

    <!-- Lógica Exclusiva del Perfil -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // Esperar un breve instante para que auth.js inicialice supabaseClient
            setTimeout(async () => {
                const { data: { session } } = await supabaseClient.auth.getSession();
                
                if (!session) {
                    alert("Debes iniciar sesión para ver tu perfil.");
                    window.location.href = 'login.html';
                    return;
                }

                const userId = session.user.id;

                // 1. Cargar datos del usuario desde la tabla 'amigos'
                const { data: perfilData, error } = await supabaseClient
                    .from('amigos')
                    .select('*')
                    .eq('auth_id', userId)
                    .single();

                if (error) {
                    console.error("Error cargando perfil:", error);
                    return;
                }

                // 2. Pintar los datos en el HTML
                document.getElementById('displayNombre').textContent = perfilData.nombre_real || "Sin Nombre";
                document.getElementById('displayRol').textContent = perfilData.rol || "Usuario";
                document.getElementById('displayApodo').textContent = perfilData.apodo_denigrante || "Sin Apodo";
                document.getElementById('displayPuntos').textContent = perfilData.puntos_myspace || "0";
                
                if (perfilData.foto_url) {
                    document.getElementById('displayFoto').src = perfilData.foto_url;
                    document.getElementById('inputFoto').value = perfilData.foto_url;
                }
                
                if (perfilData.biografia_troll) {
                    document.getElementById('inputBio').value = perfilData.biografia_troll;
                }

                // Mostrar el formulario ahora que los datos están listos
                document.getElementById('perfilForm').style.display = "block";

                // 3. Manejar el guardado del formulario
                document.getElementById('perfilForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const nuevaFoto = document.getElementById('inputFoto').value.trim();
                    const nuevaBio = document.getElementById('inputBio').value.trim();

                    const { error: updateError } = await supabaseClient
                        .from('amigos')
                        .update({ foto_url: nuevaFoto, biografia_troll: nuevaBio })
                        .eq('auth_id', userId);

                    if (updateError) {
                        alert("Error al actualizar el perfil.");
                        console.error(updateError);
                    } else {
                        alert("¡Perfil actualizado con éxito!");
                        if (nuevaFoto) document.getElementById('displayFoto').src = nuevaFoto;
                    }
                });

            }, 500); // Pequeño delay para asegurar que supabaseClient existe
        });
    </script>
</body>
</html>
