<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Días Felices - Registro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050505;
            --text-main: #ffffff;
            --text-muted: #777777;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Evita barras de desplazamiento al moverse el fondo */
        }

        /* --- FONDO ANIMADO INTERACTIVO --- */
        .interactive-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.6;
            transition: transform 0.2s ease-out;
        }
        .orb-1 {
            width: 45vw; height: 45vw;
            background: rgba(255, 255, 255, 0.05);
            top: -10%; left: -10%;
            animation: float 20s infinite alternate ease-in-out;
        }
        .orb-2 {
            width: 35vw; height: 35vw;
            background: rgba(100, 100, 100, 0.08);
            bottom: -10%; right: -10%;
            animation: float 25s infinite alternate-reverse ease-in-out;
        }
        @keyframes float {
            0% { margin-top: 0; margin-left: 0; }
            100% { margin-top: 50px; margin-left: 80px; }
        }

        /* --- ESTILOS DEL MENÚ Y REGISTRO --- */
        .navbar-custom {
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .navbar-brand-txt {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .nav-links { display: flex; gap: 40px; }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--text-main); }

        .main-content {
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 40px 20px;
            position: relative; /* Asegura que quede por encima de las luces */
        }
        .auth-box {
            width: 100%; 
            max-width: 400px; 
            padding: 40px;
            background: rgba(25, 25, 25, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px); /* Crea el efecto cristal con las luces de fondo */
        }
        .form-control-custom {
            width: 100%; 
            background: transparent; 
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; 
            padding: 12px 0; 
            margin-bottom: 25px;
            font-size: 0.9rem;
        }
        .form-control-custom:focus {
            outline: none;
            border-bottom-color: #fff;
        }
        .btn-auth {
            background: #fff; 
            color: #050505; 
            border: none; 
            padding: 16px; 
            width: 100%;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.8rem;
            margin-top: 10px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn-auth:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <!-- Las luces animadas -->
    <div class="interactive-bg">
        <div class="orb orb-1" id="orb1"></div>
        <div class="orb orb-2" id="orb2"></div>
    </div>

    <!-- Contenedor del menú inyectado -->
    <div id="menu-container"></div>

    <div class="main-content">
        <div class="auth-box">
            <h3 class="mb-4 text-white text-center" style="font-family: 'Oswald', sans-serif; letter-spacing: 2px;">REGISTRO</h3>
            <form id="registroForm">
                <input type="text" id="regNombre" class="form-control-custom" placeholder="Nombre completo" required>
                <input type="email" id="regEmail" class="form-control-custom" placeholder="Correo electrónico" required>
                <input type="password" id="regPassword" class="form-control-custom" placeholder="Contraseña" required>
                <button type="submit" class="btn-auth">CREAR CUENTA</button>
            </form>
        </div>
    </div>

    <!-- Inyección del menú y script interactivo -->
    <script>
        fetch('menu.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('menu-container').innerHTML = data;
                document.getElementById('link-registro').classList.add('active');
            });

        // Efecto interactivo con el ratón para las luces
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            
            document.getElementById('orb1').style.transform = `translate(${x * 80}px, ${y * 80}px)`;
            document.getElementById('orb2').style.transform = `translate(${x * -60}px, ${y * -60}px)`;
        });
    </script>
</body>
</html>
