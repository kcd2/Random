<script>
    setTimeout(async () => {
        if (typeof supabaseClient !== 'undefined') {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            const linkPerfil = document.getElementById('link-perfil');
            const linkLogin = document.getElementById('link-login');
            const linkRegistro = document.getElementById('link-registro');

            if (session) {
                if (linkPerfil) linkPerfil.style.display = 'inline-block';
                if (linkRegistro) linkRegistro.style.display = 'none'; 
                
                if (linkLogin) {
                    linkLogin.textContent = 'Cerrar Sesión';
                    linkLogin.href = '#';
                    linkLogin.onclick = async (e) => {
                        e.preventDefault();
                        await supabaseClient.auth.signOut();
                        window.location.href = 'index.html';
                    };
                }

                const { data: userRole } = await supabaseClient
                    .from('amigos')
                    .select('rol')
                    .eq('auth_id', session.user.id)
                    .single();
                
                if (userRole && (userRole.rol === 'administrador' || userRole.rol === 'propietario')) {
                    const linkAdmin = document.getElementById('link-admin');
                    if (linkAdmin) linkAdmin.style.display = 'inline-block';
                }
            } else {
                if (linkLogin) linkLogin.style.display = 'inline-block';
                if (linkRegistro) linkRegistro.style.display = 'inline-block';
            }
        }
    }, 300);
</script>
