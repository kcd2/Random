<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☀️ Días Felices ☀️</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { 
            background-color: #fcfcfc; 
            color: #333333;
        }
        .marquee-minimalista {
            background-color: #ffffff;
            color: #000000;
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 1rem;
        }
        .contenedor-principal {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .tarjeta-limpia {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 30px;
        }
    </style>
</head>
<body>

    <marquee class="marquee-minimalista" scrollamount="10">🔥 Bienvenidos a Días Felices: A samuel le gusta la lengua doble de rocha 🔥</marquee>

    <div class="contenedor-principal text-center mt-3">
        
        <!-- Textos solicitados -->
        <h1 class="fw-bold mb-3">☀️ DÍAS FELICES ☀️</h1>
        <p class="fs-5 text-secondary">Nani sigue sin superar a chole.</p>
        <p class="fw-bold mt-2">THE GAME.</p>
        
        <hr class="my-5" style="border-color: #e0e0e0;">
        
        <!-- Formulario del Blog -->
        <div class="tarjeta-limpia text-start mx-auto" style="max-width: 500px;">
            <h4 class="mb-4 text-center fw-bold">Blog retro</h4>
            
            <div class="mb-3">
                <label for="nombreUsuario" class="form-label">Nombre</label>
                <input type="text" id="nombreUsuario" class="form-control" placeholder="Escribe tu nombre">
            </div>
            <div class="mb-3">
                <label for="mensajeUsuario" class="form-label">Mensaje</label>
                <textarea id="mensajeUsuario" class="form-control" rows="4" placeholder="Escribe tu mensaje..."></textarea>
            </div>
            <div class="text-center mt-4">
                <button id="btnEnviar" class="btn btn-dark px-4 py-2">Enviar mensaje</button>
            </div>
        </div>

    </div>

</body>
</html>
