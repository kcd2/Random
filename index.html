<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Días Felices - Home</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --text-main: #ffffff;
            --text-muted: #777777;
            --border-color: rgba(255, 255, 255, 0.1);
            --accent: #ffffff;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at top right, rgba(40, 40, 40, 0.6), transparent 40%);
            background-repeat: no-repeat;
        }
        /* Estilos del menú que se inyectará */
        .navbar-custom {
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .navbar-brand-txt {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .nav-links { display: flex; gap: 40px; }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--text-main); }
        
        /* Estilos de la Home */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5%;
        }
        .hero-title {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(4rem, 10vw, 8rem);
            line-height: 1.1;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: -2px;
        }
        /* --- ADAPTACIÓN PARA MÓVILES (RESPONSIVE) --- */
        @media (max-width: 768px) {
            .navbar-custom {
                flex-direction: column; 
                padding: 20px 5%;
                gap: 15px;
            }
            .navbar-brand-txt {
                font-size: 1.4rem; 
                text-align: center;
            }
            .nav-links {
                gap: 20px; 
                width: 100%;
                justify-content: center;
                flex-wrap: wrap; 
            }
            .hero-title {
                font-size: 3.5rem; 
            }
        }
    </style>
</head>
<body>

    <div id="menu-container"></div>

    <!-- Contenido único de la Home -->
    <div class="main-content text-center">
        <div>
            <h1 class="hero-title">Días Felices</h1>
            <p class="fs-5 text-muted mt-3">Nani sigue sin superar a chole.</p>
        </div>
    </div>

    <!-- Script profesional para inyectar el menú -->
    <script>
        fetch('menu.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('menu-container').innerHTML = data;
                
                // Marcar el botón actual como activo (protegido por si no existe el ID)
                const linkHome = document.getElementById('link-home');
                if (linkHome) {
                    linkHome.classList.add('active');
                }
            });
    </script>

    <!-- Cargar librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Cargar la lógica que detecta tu sesión y cambia el menú dinámicamente -->
    <script src="js/auth.js"></script>
</body>
</html>
