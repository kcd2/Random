<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Días Felices - Login</title>
    <!-- Mismos links y estilos que en el index (Bootstrap, Google Fonts, variables y body) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* Copia aquí los estilos base (root, body, navbar-custom, nav-links) del index.html */
        
        /* Estilos específicos de login */
        .main-content {
            flex: 1; display: flex; align-items: center; justify-content: center;
        }
        .auth-box {
            width: 100%; max-width: 400px; padding: 40px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .form-control-custom {
            width: 100%; background: transparent; border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; padding: 12px 0; margin-bottom: 30px;
        }
        .btn-auth {
            background: #fff; color: #0a0a0a; border: none; padding: 16px; width: 100%;
        }
    </style>
</head>
<body>

    <div id="menu-container"></div>

    <div class="main-content">
        <div class="auth-box">
            <h3 class="mb-4 text-white text-center font-monospace">LOGIN</h3>
            <form>
                <input type="email" class="form-control-custom" placeholder="Correo">
                <input type="password" class="form-control-custom" placeholder="Contraseña">
                <button type="submit" class="btn-auth">INGRESAR</button>
            </form>
        </div>
    </div>

    <script>
        fetch('menu.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('menu-container').innerHTML = data;
                document.getElementById('link-login').classList.add('active');
            });
    </script>
</body>
</html>
