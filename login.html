<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Días Felices - Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --text-main: #ffffff;
            --text-muted: #777777;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at top right, rgba(40, 40, 40, 0.6), transparent 40%);
            background-repeat: no-repeat;
        }
        /* Estilos del menú */
        .navbar-custom {
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .navbar-brand-txt {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .nav-links { display: flex; gap: 40px; }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--text-main); }
        
        /* Estilos específicos de login */
        .main-content {
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        .auth-box {
            width: 100%; 
            max-width: 400px; 
            padding: 40px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
        }
        .form-control-custom {
            width: 100%; 
            background: transparent; 
            border: none;
            border-bottom: 1px solid var(--border-color);
            color: #fff; 
            padding: 12px 0; 
            margin-bottom: 30px;
        }
        .form-control-custom:focus {
            outline: none;
            border-bottom-color: #fff;
        }
        .btn-auth {
            background: #fff; 
            color: #0a0a0a; 
            border: none; 
            padding: 16px; 
            width: 100%;
            font-weight: 500;
            letter-spacing: 2px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn-auth:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div id="menu-container"></div>

    <div class="main-content">
        <div class="auth-box">
            <h3 class="mb-4 text-white text-center" style="font-family: 'Oswald', sans-serif; letter-spacing: 2px;">LOGIN</h3>
            <form>
                <input type="email" class="form-control-custom" placeholder="Correo">
                <input type="password" class="form-control-custom" placeholder="Contraseña">
                <button type="submit" class="btn-auth">INGRESAR</button>
            </form>
        </div>
    </div>

    <script>
        fetch('menu.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('menu-container').innerHTML = data;
                document.getElementById('link-login').classList.add('active');
            });
    </script>
</body>
</html>
